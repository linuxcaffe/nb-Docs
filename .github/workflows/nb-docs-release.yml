# nb Docs: a v* tag builds the signed release APK (foss flavour, one universal APK) and attaches it
# to a GitHub Release, which Obtainium follows. The release key lives only in this repo's secrets:
#   SIGNING_STORE_BASE64 (the keystore, base64), SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS,
#   SIGNING_KEY_PASSWORD
# The tag must match gradle.properties' VERSION_NAME (v1.2.0 for 1.2.0), or the release stops.
name: nb Docs release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  java-version: 17
                  distribution: "temurin"
            - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

            - name: The tag names this version
              run: |
                  v="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
                  test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but VERSION_NAME=$v"; exit 1; }

            - name: The release key
              env:
                  SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
              run: |
                  test -n "$SIGNING_STORE_BASE64" || { echo "::error::the SIGNING_* secrets aren't set"; exit 1; }
                  echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

            - name: Build the signed release APK
              env:
                  SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
                  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
              run: ./gradlew assembleFossRelease

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  apk=$(ls app/build/outputs/apk/foss/release/*-release.apk)
                  test -f "$apk" && ! echo "$apk" | grep -q unsigned || { echo "::error::no signed APK"; exit 1; }
                  out="nb-docs-${GITHUB_REF_NAME}.apk"
                  cp "$apk" "$out"
                  gh release create "$GITHUB_REF_NAME" "$out" --title "nb Docs ${GITHUB_REF_NAME}" --generate-notes
