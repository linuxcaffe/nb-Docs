# nb Docs: builds main on every push, as a check (no secrets: a throwaway debug key).
# Releases come from nb-docs-release.yml, on a v* tag.
name: nb Docs build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: nb-docs-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
              with:
                  java-version: 17
                  distribution: "temurin"
            - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

            - name: Build the debug APK
              run: ./gradlew -PVERSION_NAME="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)-${GITHUB_SHA::7}" assembleFossDebug

            - name: Upload it
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: "nb-docs-foss-debug"
                  path: "app/build/outputs/apk/foss/debug/*debug.apk"
